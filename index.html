<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b14">
  <title>Road to Pro | Leagues</title>
  <style>
    :root {
      --bg: #080b14;
      --panel: #111827;
      --border: #27344d;
      --text: #f4f7ff;
      --muted: #98a6bf;
      --blue: #48a5ff;
      --purple: #a16eff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 15% 0%, #17325a44, transparent 40%),
        radial-gradient(ellipse at 90% 25%, #54247720, transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 7%;
      background: #0a0f1bcc;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .brand span { color: var(--blue); }

    .status {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 55px 22px;
    }

    .eyebrow {
      color: var(--blue);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    h1 {
      font-size: clamp(38px, 7vw, 62px);
      letter-spacing: -2px;
      margin: 12px 0;
    }

    h1 span {
      color: var(--blue);
      text-shadow: 0 0 28px #48a5ff50;
    }

    .subtitle {
      color: var(--muted);
      line-height: 1.7;
      max-width: 560px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 36px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

      padding: 13px 25px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #111
